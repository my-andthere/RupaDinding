<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="w-fasad-after" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9a288"/>
      <stop offset="100%" stop-color="#e8e2d8"/>
